<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="100" fill="#101626"/>

  <!-- diagonal glow behind the winning line -->
  <line x1="128" y1="384" x2="424" y2="128" stroke="#f2b632" stroke-width="40" stroke-linecap="round" opacity="0.28"/>

  <!-- lower two tiers of the cage (not shifted) -->
  <rect x="64" y="192" width="384" height="256" rx="20" fill="none" stroke="#d8c49a" stroke-width="13"/>
  <line x1="192" y1="192" x2="192" y2="448" stroke="#d8c49a" stroke-width="9"/>
  <line x1="320" y1="192" x2="320" y2="448" stroke="#d8c49a" stroke-width="9"/>
  <line x1="64" y1="320" x2="448" y2="320" stroke="#d8c49a" stroke-width="9"/>

  <!-- top tier, turned (shifted right, kept inside the rounded corner) -->
  <rect x="104" y="64" width="384" height="128" rx="20" fill="none" stroke="#d8c49a" stroke-width="13"/>
  <line x1="232" y1="64" x2="232" y2="192" stroke="#d8c49a" stroke-width="9"/>
  <line x1="360" y1="64" x2="360" y2="192" stroke="#d8c49a" stroke-width="9"/>

  <!-- cubes: bottom row -->
  <g transform="translate(78,334)">
    <rect width="100" height="100" rx="20" fill="#f2b632" stroke="#00000026" stroke-width="3"/>
    <path d="M50,22 L76,78 L24,78 Z" fill="#ffffff" opacity="0.85"/>
  </g>
  <g transform="translate(206,334)">
    <rect width="100" height="100" rx="20" fill="#5ab0e8" stroke="#00000026" stroke-width="3"/>
    <rect x="39" y="18" width="22" height="64" rx="7" fill="#ffffff" opacity="0.85"/>
    <rect x="18" y="39" width="64" height="22" rx="7" fill="#ffffff" opacity="0.85"/>
  </g>
  <g transform="translate(334,334)">
    <rect width="100" height="100" rx="20" fill="#f07a5a" stroke="#00000026" stroke-width="3"/>
    <circle cx="50" cy="50" r="27" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- cubes: middle row -->
  <g transform="translate(206,206)">
    <rect width="100" height="100" rx="20" fill="#f2b632" stroke="#00000026" stroke-width="3"/>
    <path d="M50,22 L76,78 L24,78 Z" fill="#ffffff" opacity="0.85"/>
  </g>
  <g transform="translate(334,206)">
    <rect width="100" height="100" rx="20" fill="#9b86e0" stroke="#00000026" stroke-width="3"/>
    <path d="M50,18 L59,42 L82,50 L59,58 L50,82 L41,58 L18,50 L41,42 Z" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- cubes: top row (turned) -->
  <g transform="translate(246,78)">
    <rect width="100" height="100" rx="20" fill="#5ab0e8" stroke="#00000026" stroke-width="3"/>
    <rect x="39" y="18" width="22" height="64" rx="7" fill="#ffffff" opacity="0.85"/>
    <rect x="18" y="39" width="64" height="22" rx="7" fill="#ffffff" opacity="0.85"/>
  </g>
  <g transform="translate(374,78)">
    <rect width="100" height="100" rx="20" fill="#f2b632" stroke="#00000026" stroke-width="3"/>
    <path d="M50,22 L76,78 L24,78 Z" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
