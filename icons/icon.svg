    <circle cx="64" cy="704" r="7"/><circle cx="192" cy="704" r="7"/><circle cx="320" cy="704" r="7"/><circle cx="448" cy="704" r="7"/><circle cx="576" cy="704" r="7"/><circle cx="704" cy="704" r="7"/><circle cx="832" cy="704" r="7"/><circle cx="960" cy="704" r="7"/>
