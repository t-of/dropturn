  <!-- 角から広がる大きな四分円（同心） -->
  <path d="M0 0H480A480 480 0 0 1 0 480z" fill="#F2B632"/>
  <path d="M0 0H300A300 300 0 0 1 0 300z" fill="#E4573D"/>

  <!-- かご：生成りの大きな面 -->
  <rect x="200" y="220" width="624" height="624" rx="56" fill="#F4EEE1"/>

  <!-- そろえた 2 つの箱（大きな色面。記号なし） -->
  <rect x="232" y="656" width="196" height="196" rx="32" fill="#2F57E0"/>
  <rect x="420" y="468" width="196" height="196" rx="32" fill="#F2B632"/>

  <!-- 落ちてくる箱（面のまま。落下は塗りの三角で示す） -->
  <path d="M608 336 H784 L696 444z" fill="#E4573D"/>
  <rect x="608" y="140" width="176" height="176" rx="28" fill="#E4573D"/>

  <!-- 回す矢印：太い四分円の帯＋三角の矢じり -->
  <path d="M900 800A100 100 0 0 1 800 900" fill="none" stroke="#1E9E6A" stroke-width="72"/>
  <path d="M726 862 L800 900 L792 814z" fill="#1E9E6A"/>
